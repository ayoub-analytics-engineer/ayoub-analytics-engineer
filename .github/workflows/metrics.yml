# Generates metrics.svg and metrics.calendar.svg for the profile README
# Full reference: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, midnight UTC
  workflow_dispatch:       # allows manual runs from the Actions tab
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Core metrics: header, activity, repositories, most-used languages
      - name: Generate base metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ayoub-data-analyst
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%

      # Isometric contribution calendar
      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ayoub-data-analyst
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
