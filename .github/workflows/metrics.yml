# Generates the two DYNAMIC panels used in README.md:
#   assets/metrics-github.svg   -> GitHub stats + languages ("GitHub Metrics" section)
#   assets/metrics-pulse.svg    -> isometric contribution calendar ("Activity Pulse" section)
# Everything else in the README (hero, core metrics, stack analytics, flow,
# project cards) is static because it comes from fixed project facts, not
# from the GitHub API, and is committed once as plain SVG files.
#
# Full option reference: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # refresh once a day
  workflow_dispatch:         # allow manual runs from the Actions tab
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub stats + languages
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-github.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ayoub-data-analyst
          base: header, activity, repositories
          config_theme: dark
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%

      - name: Contribution / activity pulse
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-pulse.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ayoub-data-analyst
          base: ""
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
